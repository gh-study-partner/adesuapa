async function pdfText(doc){const o=[];for(let i=1;i<=Math.min(doc.numPages,80);i++){let t='',y=null;(await(await doc.getPage(i)).getTextContent()).items.forEach(it=>{const Y=it.transform[5];t+=(y!==null&&Math.abs(Y-y)>2?'\n':' ')+it.str;y=Y});o.push(t.trim())}return o}
const loadPdf=u=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';return pdfjsLib.getDocument({data:u}).promise};
function pag(t){const o=[];let c='';t.split(/\n+/).forEach(p=>{if((c+p).length>1100&&c){o.push(c);c=''}c+=(c?'\n':'')+p});c&&o.push(c);return o}
async function convert(f){const ext=f.name.split('.').pop().toLowerCase(),title=f.name.replace(/\.[^.]+$/,'');let pages=[];
if(ext==='pdf'){const pdf=await b2d(new Blob([f],{type:'application/pdf'}));return{title,pdf,pages:await pdfText(await loadPdf(d2u(pdf)))}}
if(ext==='docx')pages=pag((await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value);
else if(ext==='pptx'){const z=await JSZip.loadAsync(await f.arrayBuffer()),n=Object.keys(z.files).filter(k=>/^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a,b)=>a.match(/\d+/)[0]-b.match(/\d+/)[0]);for(const k of n){const x=await z.file(k).async('string');pages.push(x.split('</a:p>').map(p=>[...p.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1]).join('')).filter(Boolean).join('\n').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'"))}}
else if(/^(txt|md)$/.test(ext))pages=pag(await f.text());else throw 0;
const d=new window.jspdf.jsPDF({unit:'pt',format:'a4'});pages.forEach((p,i)=>{if(i)d.addPage();d.setFontSize(11);d.text(d.splitTextToSize(p,500).slice(0,60),48,64)});
return{title,pages,pdf:await b2d(new Blob([d.output('arraybuffer')],{type:'application/pdf'}))}}
async function addMat(cid,el){const f=el.files[0];el.value='';if(!f)return;toast('Converting to PDF…');try{const r=await convert(f);if(r.pdf.length>9e5)return toast('Too big after conversion. Keep files under about 650 KB.');const x=await api('upload',{cid,title:r.title,data:r.pdf,pages:r.pages});if(x.error)return toast(x.error);S.courses=x.courses;toast('Added. It is now a PDF and a textbook chapter.');course(cid)}catch(e){toast('Could not convert this file. Use PDF, DOCX, PPTX or TXT.')}}
async function delM(cid,mid){const c=S.courses.find(x=>x.id===cid),r=await api('savecourse',{course:{...c,materials:c.materials.filter(m=>m.id!==mid)}});if(r.error)return toast(r.error);S.courses=r.courses;course(cid)}
let PD,ZM=1.2,VID,RT=0;
async function openPdf(id){const r=await api('file',{id});if(r.error)return toast(r.error);try{PD=await loadPdf(d2u(r.data))}catch(e){return toast('Could not open this file.')}VID=[r.data,findM(id).title];ZM=innerWidth<800?.7:1.2;$('#vt').textContent=VID[1];$('#ov').className='show';rpdf()}
async function rpdf(){const my=++RT,s=$('#vs');s.innerHTML='';$('#pt').textContent=PD.numPages;$('#zp').textContent=Math.round(ZM/1.2*100)+'%';s.onscroll=()=>{let k=0;[...s.children].forEach((e,i)=>{if(e.offsetTop-s.scrollTop<s.clientHeight/2)k=i});$('#pi').value=k+1};for(let n=1;n<=PD.numPages;n++){if(my!==RT)return;const p=await PD.getPage(n),v=p.getViewport({scale:ZM*1.4}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;c.style.width=v.width/1.4+'px';c.className='pgc';s.append(c);await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise}}
const zoom=d=>{ZM=Math.max(.6,Math.min(2.4,ZM+d));rpdf()},gp=n=>{const c=$('#vs').children[+n-1];c&&$('#vs').scrollTo({top:c.offsetTop-12,behavior:'smooth'})},cv=()=>{RT++;$('#ov').className=''},dlv=()=>{const a=document.createElement('a');a.href=VID[0];a.download=VID[1]+'.pdf';a.click()};
async function dl(id){const r=await api('file',{id});if(r.error)return toast(r.error);VID=[r.data,findM(id).title];dlv()}
addEventListener('keydown',e=>{if(e.key==='Escape'){cv();$('#np').classList.remove('open')}});

function pasco(cid){$('#lz').innerHTML=`<div class="bar"><select id="pc">${S.courses.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select><button onclick="startQ()">${I('play',16)} Play</button><label class="btn alt">${I('up',16)} Upload past questions<input type="file" id="pf" accept=".pdf,.txt" hidden onchange="upQ(this)"></label></div><div class="bar"><input id="gt" placeholder="Or type a topic and let AI write questions"><button class="ghost" onclick="genQ()">${I('spark',16)} Generate</button></div><p class="mu">Upload format: “1. Question? A. … B. … C. … D. … Answer: B”.</p><div id="qa"></div>`}
function parseQ(t){const qs=[];t.replace(/\r/g,'').split(/\n(?=\s*\d{1,3}[.)]\s)/).forEach(b=>{const m=b.match(/^\s*\d{1,3}[.)]\s*([\s\S]*?)(?=\s\(?A[.)]\s)/),o=[...b.matchAll(/(?:^|\s)\(?([A-E])[.)]\s+([\s\S]*?)(?=\s\(?[A-E][.)]\s|\s*(?:Ans(?:wer)?|Correct)\s*[:\-]|$)/g)],a=b.match(/(?:Ans(?:wer)?|Correct)\s*[:\-]?\s*\(?([A-E])/i),f=s=>s.trim().replace(/\s+/g,' ');if(m&&o.length>1&&a)qs.push({q:f(m[1]),o:o.map(x=>f(x[2])),a:'ABCDE'.indexOf(a[1].toUpperCase())})});return qs}
async function upQ(el){const f=el.files[0];if(!f)return;let t='';try{t=/pdf$/i.test(f.name)?(await pdfText(await loadPdf(new Uint8Array(await f.arrayBuffer())))).join('\n'):await f.text()}catch(e){return toast('Could not read that file.')}const qs=parseQ(t);if(!qs.length)return toast('No questions found. Check the upload format.');await api('addq',{cid:$('#pc').value,qs});toast(qs.length+' questions added to this course.')}
async function genQ(){const t=$('#gt').value.trim();if(!t)return toast('Type a topic first.');toast('Writing questions…');const c=S.courses.find(x=>x.id===$('#pc').value),r=await api('genq',{course:c.name,topic:t});if(r.error)return toast(r.error);await api('addq',{cid:c.id,qs:r.qs});toast(r.qs.length+' questions added.')}
async function startQ(){const r=await api('getq',{cid:$('#pc').value}),l=(r.qs||[]).sort(()=>Math.random()-.5).slice(0,10);if(!l.length)return $('#qa').innerHTML='<p class="mu">No questions for this course yet. Upload past questions above.</p>';Q={l,i:0,ok:0,st:0,xp:0,d:0};showQ()}
function showQ(){const q=Q.l[Q.i];if(!q)return endQ();$('#qa').innerHTML=`<div class="card"><div class="prog"><i style="width:${Q.i/Q.l.length*100}%"></i></div><p class="mu">Question ${Q.i+1} of ${Q.l.length}. Streak ${Q.st}. XP ${Q.xp}</p><div class="q">${esc(q.q)}</div>${q.o.map((o,i)=>`<button class="opt" onclick="pick(${i})">${'ABCDE'[i]}. ${esc(o)}</button>`).join('')}</div>`}
function pick(i){if(Q.d)return;Q.d=1;const q=Q.l[Q.i],b=document.querySelectorAll('.opt');b[q.a].classList.add('ok');if(i===q.a){Q.ok++;Q.st++;Q.xp+=10+Math.min(Q.st,5)*2}else{b[i].classList.add('no');Q.st=0}setTimeout(()=>{Q.d=0;Q.i++;showQ()},1100)}
async function endQ(){const r=await api('saveme',{xp:(S.user.xp||0)+Q.xp});if(r.user)S.user=r.user;$('#qa').innerHTML=`<div class="card"><h2>${Q.ok>=Q.l.length*.7?'Great work!':'Keep going'}</h2><p>You got ${Q.ok} of ${Q.l.length} and earned ${Q.xp} XP. Total XP: ${S.user.xp}.</p><div class="bar"><button onclick="startQ()">Play again</button></div></div>`}

function tab(n){$('#t1').className=n==1?'on':'';$('#t2').className=n==2?'on':'';if(n==1){$('#tb').innerHTML=`<div class="bar"><input id="yq" placeholder="Type a topic or a question" onkeydown="event.key==='Enter'&&yt()"><button onclick="yt()">${I('search',16)} Search videos</button></div><div id="pl"></div><div id="yr" class="grid"></div>`}else $('#tb').innerHTML=`<div class="live"><div class="scr"><video id="sv2" autoplay muted playsinline></video><div class="bar"><button onclick="share()">${I('mon',16)} Share screen</button><button class="ghost" onclick="stopS()">Stop</button><label><input type="checkbox" id="sn" checked> Tutor sees my screen</label><label><input type="checkbox" id="sp"> Speak answers</label></div></div><div class="card"><div id="cm"><div class="bb ai">Hi! Share your screen or just ask me anything about your course.</div></div><div class="bar"><input id="ci" placeholder="Ask your tutor" onkeydown="event.key==='Enter'&&say()"><button class="ghost" onclick="mic()" aria-label="Speak">${I('mic',16)}</button><button onclick="say()" aria-label="Send">${I('send',16)}</button></div></div></div>`}

function snap(){const v=$('#sv2');if(!ST||!v.videoWidth)return null;const c=document.createElement('canvas'),w=Math.min(1024,v.videoWidth);c.width=w;c.height=w*v.videoHeight/v.videoWidth;c.getContext('2d').drawImage(v,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6).split(',')[1]}
