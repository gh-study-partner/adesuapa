<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Adesua Pa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--g1:#0b3d2e;--g2:#1b6b45;--lime:#c6ef5a;--yg:#e3ec6a;--bg:#f3f8ec;--card:#fff;--tx:#14261c;--mu:#5c7366;--ln:#dbe7d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1a13;--card:#142a1f;--tx:#e8f3e4;--mu:#9bb5a3;--ln:#27432f}}
:root[data-theme=dark]{--bg:#0c1a13;--card:#142a1f;--tx:#e8f3e4;--mu:#9bb5a3;--ln:#27432f}
*{box-sizing:border-box;margin:0}body{font:15px/1.5 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
h1,h2,h3,.logo{font-family:'Bricolage Grotesque',Figtree,sans-serif}h2{font-size:28px;margin-bottom:4px}h3{margin:22px 0 8px}.mu{color:var(--mu)}
button,.btn{font:inherit;font-weight:700;background:var(--g1);color:var(--lime);border:0;border-radius:10px;padding:9px 16px;cursor:pointer;display:inline-block}
button:hover,.btn:hover{background:var(--g2)}button.ghost{background:transparent;color:var(--g2);border:1.5px solid var(--ln)}.alt{background:var(--lime);color:var(--g1)}.alt:hover{background:var(--yg)}button.danger{background:#b3361f;color:#fff}
input,select{font:inherit;padding:9px 12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);min-width:0}input:focus,select:focus,button:focus-visible{outline:2px solid var(--g2);outline-offset:1px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.bar input{flex:1;min-width:140px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.c{cursor:pointer;padding:0;overflow:hidden;transition:transform .15s}.c:hover{transform:translateY(-3px)}.c h3{margin:12px 16px 2px}.c p,.c .pill{margin:0 16px 14px;display:block}
.band{height:84px;display:flex;align-items:flex-end;padding:10px 16px;font:800 20px 'Bricolage Grotesque';color:var(--g1);background:linear-gradient(135deg,var(--lime),var(--yg))}.b1{background:linear-gradient(135deg,var(--g2),var(--lime));color:#fff}.b2{background:linear-gradient(135deg,var(--yg),#8fc74a)}.b3{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--lime)}
.pill{font-size:13px;font-weight:700;color:var(--g2)}.li{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln)}.li span,.li b{flex:1}
#app{display:flex;min-height:100vh}nav{width:210px;background:var(--g1);color:#fff;padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
nav .logo{font-size:22px;font-weight:800;color:var(--lime);margin:0 8px 18px}nav button{background:transparent;color:#cfe3d3;text-align:left;width:100%}nav button.on{background:var(--lime);color:var(--g1)}nav .sp{flex:1}
main{flex:1;padding:28px;max-width:1100px;min-width:0}
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh;width:100%}.hero{background:var(--g1);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:58px;line-height:1.02;color:var(--lime);margin:14px 0}.hero p{max-width:420px;color:#cfe3d3}.hero .logo{font-size:20px}
.panel{padding:48px;display:flex;flex-direction:column;gap:10px;justify-content:center;max-width:460px;width:100%;margin:auto}.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{background:var(--card);color:var(--mu);border:1.5px solid var(--ln)}.tabs button.on{background:var(--g1);color:var(--lime)}
.q{font:700 20px 'Bricolage Grotesque';margin:14px 0}.opt{display:block;width:100%;text-align:left;margin:7px 0;background:var(--card);color:var(--tx);border:1.5px solid var(--ln)}.opt.ok{background:var(--lime);color:var(--g1);border-color:var(--g2)}.opt.no{background:#f6d6cf;color:#7a2514}
.prog{height:8px;background:var(--ln);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--lime));transition:width .3s}
.live{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}.scr video,#pl iframe{width:100%;aspect-ratio:16/9;background:#06140d;border-radius:12px;border:0}#pl{margin-bottom:12px}
#cm{height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px}.bb{padding:9px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap}.bb.me{background:var(--g1);color:#fff;align-self:flex-end}.bb.ai{background:var(--ln)}
.pt{height:70px;border-radius:10px;background:var(--g1);color:var(--lime);display:grid;place-items:center;font-size:26px;margin-bottom:8px}.vd{cursor:pointer}
#ov{display:none;position:fixed;inset:0;background:rgba(6,20,13,.92);z-index:9;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}#ov.show{display:flex}
#pg{display:flex;perspective:1600px;background:#2b1d12;padding:12px 8px;border-radius:12px;box-shadow:0 20px 50px #000a;max-width:96vw;max-height:78vh;overflow:hidden}
.pp{width:min(42vw,420px);background:#fffdf3 repeating-linear-gradient(transparent 0 27px,#cfe3d3 27px 28px);border-left:2px solid #e9a1a1;padding:10px;min-height:200px}.pp canvas{width:100%;display:block;mix-blend-mode:multiply}#R{border-left:1px dashed #b9a;box-shadow:inset 14px 0 18px -14px #0006}#L{box-shadow:inset -14px 0 18px -14px #0006}
.tn{transform-origin:left;animation:tn .32s ease-in forwards}.tp{transform-origin:right;animation:tp .32s ease-in forwards}@keyframes tn{to{transform:rotateY(-80deg);opacity:.2}}@keyframes tp{to{transform:rotateY(80deg);opacity:.2}}
.av{width:84px;height:84px;border-radius:50%;background:var(--lime);color:var(--g1);display:grid;place-items:center;font:800 30px 'Bricolage Grotesque';object-fit:cover}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--g1);color:var(--lime);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:20}#toast.show{opacity:1}
@media(max-width:800px){.auth{grid-template-columns:1fr}.hero{padding:32px}.hero h1{font-size:40px}.panel{padding:24px}#app{flex-direction:column-reverse}nav{width:100%;height:auto;flex-direction:row;position:fixed;bottom:0;left:0;right:0;z-index:5;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}nav .logo,nav .sp{display:none}nav button{text-align:center;padding:8px 4px;font-size:12px}main{padding:18px 16px 90px}.live{grid-template-columns:1fr}.pp{width:88vw}}
</style></head><body><div id="app"></div><div id="ov"><div id="pg"></div><div class="bar"><button onclick="flip(-1)">◀ Back</button><b id="pn" style="color:#fff"></b><button onclick="flip(1)">Next ▶</button><button class="alt" onclick="$('#ov').className=''">Close</button></div></div><div id="toast"></div>
<script>
async function handle(S,a,d,tok){
const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const H=async s=>hx(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));
const rid=()=>hx(crypto.getRandomValues(new Uint8Array(10)));
const env=typeof process!=='undefined'&&process.env?process.env:{};
const AU=env.ADMIN_USER||'lord',AP=env.ADMIN_PASS||'lord@123';
const J=async k=>{const v=await S.get(k);return v?JSON.parse(v):null},W=(k,v)=>S.set(k,JSON.stringify(v));
const SEED=[['Data Communication & Networking','ICTEW 353'],['Ethics',''],['Guidance & Counselling',''],['MOT',''],['Research',''],['Technology Leadership',''],['Trends','']].map((x,i)=>({id:'c'+(i+1),name:x[0],code:x[1],school:'UEW',level:'All levels',materials:[]}));
const who=tok?await S.get('t:'+tok):null,adm=who==='#admin';
const u=(who&&!adm)?await J('u:'+who):null;
const pub=o=>{o={...o};delete o.salt;delete o.hash;return o};
const sess=async v=>{const t=rid();await S.set('t:'+t,v,2592000);return t};
const cl=async(sys,msgs,n)=>{const k=env.ANTHROPIC_API_KEY;if(!k)return{error:'The AI tutor is not switched on yet. Add ANTHROPIC_API_KEY in Vercel.'};const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:env.ANTHROPIC_MODEL||'claude-sonnet-4-5',max_tokens:n||900,system:sys,messages:msgs})});const j=await r.json();return j.error?{error:j.error.message}:{text:(j.content||[]).map(c=>c.text||'').join('')}};
if(a==='signup'){const e=(d.email||'').trim().toLowerCase();if(!e||!d.name||!d.password||d.password.length<6)return{error:'Fill every field. Password needs 6+ characters.'};if(await S.get('u:'+e))return{error:'This email already has an account. Log in instead.'};const salt=rid(),n={email:e,name:String(d.name).slice(0,60),school:String(d.school||'').slice(0,80),level:d.level||'',pic:'',xp:0,salt,hash:await H(salt+d.password)};await W('u:'+e,n);await W('ulist',((await J('ulist'))||[]).concat(e));return{token:await sess(e),user:pub(n)}}
if(a==='login'){const id=(d.id||'').trim().toLowerCase();if(id===AU.toLowerCase()&&d.password===AP)return{token:await sess('#admin'),admin:true};const x=await J('u:'+id);if(!x||x.hash!==await H(x.salt+d.password))return{error:'Wrong email or password.'};return{token:await sess(id),user:pub(x)}}
if(!who||(!adm&&!u))return{error:'Please log in.'};
if(a==='me')return adm?{admin:true}:{user:pub(u)};
if(a==='saveme'&&u){const n={...u};['name','school','level','pic'].forEach(k=>{if(typeof d[k]==='string')n[k]=d[k].slice(0,k==='pic'?60000:80)});if(typeof d.xp==='number')n.xp=Math.max(u.xp||0,Math.min(d.xp,1e6));await W('u:'+u.email,n);return{user:pub(n)}}
if(a==='courses')return{courses:(await J('courses'))||SEED};
if(a==='file'){const f=await S.get('f:'+d.id);return f?{data:f}:{error:'File not found.'}}
if(a==='getq')return{qs:(await J('q:'+d.cid))||[]};
if(a==='addq'){const q=((await J('q:'+d.cid))||[]).concat((d.qs||[]).slice(0,100)).slice(-300);await W('q:'+d.cid,q);return{n:q.length}}
if(a==='yt'){const k=env.YOUTUBE_API_KEY;if(!k)return{items:[],note:'Video search needs YOUTUBE_API_KEY (see README).'};const r=await(await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=9&q='+encodeURIComponent(d.q)+'&key='+k)).json();return{items:(r.items||[]).map(i=>({id:i.id.videoId,title:i.snippet.title,ch:i.snippet.channelTitle}))}}
if(a==='ai'){const m=(d.msgs||[]).slice(-10).map(x=>({role:x.role,content:String(x.content).slice(0,4000)}));while(m.length&&m[0].role!=='user')m.shift();if(!m.length)return{error:'Say something first.'};if(d.img){const l=m[m.length-1];if(l.role==='user')l.content=[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:d.img}},{type:'text',text:l.content}]}return cl('You are Adesua Pa, a friendly AI tutor for students in Ghana. Explain step by step in simple English with short examples. If a screenshot is attached, help with what is on screen.',m)}
if(a==='genq'){const r=await cl('Return ONLY a JSON array of 8 multiple-choice questions: [{"q":"","o":["","","",""],"a":0}] where a is the index of the correct option.',[{role:'user',content:'Course: '+String(d.course).slice(0,100)+'. Topic: '+String(d.topic).slice(0,200)}],1800);if(!r.text)return r;try{return{qs:JSON.parse(r.text.replace(/```json|```/g,'').trim())}}catch(e){return{error:'Could not read the AI reply. Try again.'}}}
if(!adm)return{error:'Admins only.'};
const L=(await J('courses'))||SEED;
if(a==='users')return{n:((await J('ulist'))||[]).length};
if(a==='savecourse'){const c=d.course;c.id=c.id||rid();c.materials=c.materials||[];const i=L.findIndex(x=>x.id===c.id);i<0?L.push(c):L[i]=c;await W('courses',L);return{courses:L}}
if(a==='delcourse'){const c=L.find(x=>x.id===d.id),R=L.filter(x=>x.id!==d.id);for(const m of(c?c.materials:[]))await S.del('f:'+m.id);await S.del('q:'+d.id);await W('courses',R);return{courses:R}}
if(a==='upload'){if(!/^data:application\/pdf;base64,/.test(d.data||'')||d.data.length>9e5)return{error:'PDF only, up to about 650 KB per file. Compress it first.'};const c=L.find(x=>x.id===d.cid);if(!c)return{error:'Course not found.'};const id=rid();await S.set('f:'+id,d.data);c.materials.push({id,title:String(d.title||'Untitled').slice(0,80)});await W('courses',L);return{courses:L}}
return{error:'Unknown action.'}}
if(typeof module!=='undefined')module.exports={handle};

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),app=$('#app');
const S={tok:null,user:null,admin:false,courses:[],arg:null},LV=['SHS','Level 100','Level 200','Level 300','Level 400','Masters'],mem={};
const loc={get:async k=>{try{return localStorage.getItem('ap:'+k)}catch(e){return mem[k]??null}},set:async(k,v)=>{try{localStorage.setItem('ap:'+k,v)}catch(e){mem[k]=v}},del:async k=>{try{localStorage.removeItem('ap:'+k)}catch(e){delete mem[k]}}};
async function api(a,d){try{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a,d,tok:S.tok})});if(!(r.headers.get('content-type')||'').includes('json'))throw 0;return await r.json()}catch(e){return handle(loc,a,d||{},S.tok)}}
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='show';setTimeout(()=>t.className='',2800)};
const lvOpts=(s)=>LV.map(l=>`<option ${l===s?'selected':''}>${l}</option>`).join('');
function authView(m='login'){const L=m==='login';app.innerHTML=`<div class="auth"><div class="hero"><div class="logo">🌿 Adesua Pa</div><h1>Good education, in your pocket.</h1><p>Read your course books, watch video tutorials, talk to an AI tutor and practise past questions. All in one place.</p></div><div class="panel"><h2>${L?'Welcome back':'Create your account'}</h2><div class="tabs"><button class="${L?'on':''}" onclick="authView('login')">Log in</button><button class="${L?'':'on'}" onclick="authView('up')">Sign up</button></div>${L?'':'<input id="an" placeholder="Full name"><input id="as" placeholder="School (e.g. UEW)"><select id="al">'+lvOpts('Level 300')+'</select>'}<input id="ae" placeholder="${L?'Email or admin username':'Email'}" autocomplete="username"><input id="ap" type="password" placeholder="Password" autocomplete="current-password" onkeydown="event.key==='Enter'&&doAuth('${m}')"><button onclick="doAuth('${m}')">${L?'Log in':'Create account'}</button></div></div>`}
async function doAuth(m){const g=i=>$('#'+i).value.trim(),L=m==='login',r=await api(L?'login':'signup',L?{id:g('ae'),password:$('#ap').value}:{name:g('an'),email:g('ae'),school:g('as'),level:g('al'),password:$('#ap').value});if(r.error)return toast(r.error);S.tok=r.token;try{localStorage.setItem('ap_t',r.token)}catch(e){}S.user=r.user;S.admin=!!r.admin;enter()}
async function enter(){S.courses=(await api('courses')).courses||[];const N=S.admin?[['admin','🛠','Admin'],['home','📚','Courses'],['library','📖','Library']]:[['home','📚','Courses'],['teach','🎓','TeachMe'],['library','📖','Library'],['pasco','🎮','Pasco'],['acct','👤','Account']];app.innerHTML=`<nav><div class="logo">🌿 Adesua Pa</div>${N.map(n=>`<button id="n-${n[0]}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</button>`).join('')}<div class="sp"></div><button onclick="logout()">⎋ Log out</button></nav><main id="v"></main>`;go(S.admin?'admin':'home')}
function logout(){S.tok=null;try{localStorage.removeItem('ap_t')}catch(e){}stopS();authView()}
function go(v,arg){S.arg=arg||null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id==='n-'+v));({admin,home,teach,library,pasco,acct})[v]();scrollTo(0,0)}
function home(){const lv=[...new Set(S.courses.map(c=>c.level))];$('#v').innerHTML=`<h2>${S.admin?'All courses':'Hello, '+esc(S.user.name.split(' ')[0])}</h2><p class="mu">Pick a course to read, watch and practise.</p><div class="bar"><input id="q" placeholder="Search courses" oninput="drawC()"><select id="lf" onchange="drawC()"><option value="">All levels</option>${lv.map(l=>`<option>${esc(l)}</option>`).join('')}</select></div><div id="cg" class="grid"></div>`;drawC()}
function drawC(){const q=$('#q').value.toLowerCase(),l=$('#lf').value;$('#cg').innerHTML=S.courses.filter(c=>(c.name+c.code).toLowerCase().includes(q)&&(!l||c.level===l)).map((c,i)=>`<div class="card c" onclick="course('${c.id}')"><div class="band b${i%4}">${esc(c.code||c.name.slice(0,3))}</div><h3>${esc(c.name)}</h3><p class="mu">${esc(c.school)}, ${esc(c.level)}</p><span class="pill">${c.materials.length} material${c.materials.length==1?'':'s'}</span></div>`).join('')||'<p class="mu">No courses match. Try another search.</p>'}
function course(id){const c=S.courses.find(x=>x.id===id);$('#v').innerHTML=`<button class="ghost" onclick="go('home')">← Courses</button><h2 style="margin-top:12px">${esc(c.name)}</h2><p class="mu">${esc(c.school)}, ${esc(c.level)}</p><div class="bar">${S.admin?'':`<button onclick="go('teach',{c:'${c.id}'})">▶ Watch tutorials</button><button class="alt" onclick="go('pasco',{cid:'${c.id}'})">🎮 Practise</button>`}</div><h3>Materials</h3>${c.materials.map(m=>`<div class="li"><span>📄 ${esc(m.title)}</span><button onclick="readBook('${m.id}')">Read</button><button class="ghost" onclick="dl('${m.id}','${esc(m.title)}')">Download</button></div>`).join('')||'<p class="mu">No materials yet. Your admin will upload them soon.</p>'}`}
async function dl(id,t){const r=await api('file',{id});if(r.error)return toast(r.error);const a=document.createElement('a');a.href=r.data;a.download=t+'.pdf';a.click()}
function library(){const sc=[...new Set(S.courses.map(c=>c.school))];$('#v').innerHTML=`<h2>Library</h2><p class="mu">Open any book and flip through it. Download what you need.</p><div class="bar"><select id="ls" onchange="shelf()"><option value="">All schools</option>${sc.map(s=>`<option>${esc(s)}</option>`).join('')}</select><select id="ll" onchange="shelf()"><option value="">All levels</option><option>All levels</option>${lvOpts()}</select><select id="lc" onchange="shelf()"><option value="">All courses</option>${S.courses.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div id="sh" class="grid"></div>`;shelf()}
function shelf(){const s=$('#ls').value,l=$('#ll').value,c=$('#lc').value;$('#sh').innerHTML=S.courses.filter(x=>(!s||x.school===s)&&(!l||x.level===l)&&(!c||x.id===c)).flatMap((x,i)=>x.materials.map(m=>`<div class="card c"><div class="band b${i%4}">📖</div><h3>${esc(m.title)}</h3><p class="mu">${esc(x.name)}</p><div class="bar" style="margin:0 16px 14px"><button onclick="readBook('${m.id}')">Open</button><button class="ghost" onclick="dl('${m.id}','${esc(m.title)}')">Download</button></div></div>`)).join('')||'<p class="mu">No books here yet.</p>'}
let PD,PG=1;const one=()=>innerWidth<800;
async function loadPdf(d){const b=atob(d.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';return pdfjsLib.getDocument({data:u}).promise}
async function readBook(id){const r=await api('file',{id});if(r.error)return toast(r.error);toast('Opening book…');try{PD=await loadPdf(r.data)}catch(e){return toast('Could not open this PDF.')}PG=1;$('#ov').className='show';drawBook()}
async function pageTo(n,el){if(n<1||n>PD.numPages)return;const p=await PD.getPage(n),v=p.getViewport({scale:1.5}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;el.append(c)}
async function drawBook(){$('#pg').innerHTML='<div class="pp" id="L"></div>'+(one()?'':'<div class="pp" id="R"></div>');await pageTo(PG,$('#L'));if(!one())await pageTo(PG+1,$('#R'));$('#pn').textContent=PG+(one()?'':'–'+Math.min(PG+1,PD.numPages))+' / '+PD.numPages}
async function flip(d){const s=one()?1:2,n=PG+d*s;if(!PD||n<1||n>PD.numPages)return;$(d>0&&!one()?'#R':'#L').classList.add(d>0?'tn':'tp');await new Promise(r=>setTimeout(r,320));PG=n;drawBook()}
addEventListener('keydown',e=>{if($('#ov').className){if(e.key==='ArrowRight')flip(1);if(e.key==='ArrowLeft')flip(-1);if(e.key==='Escape')$('#ov').className=''}});
function teach(){const c=S.courses.find(x=>x.id===(S.arg||{}).c);$('#v').innerHTML=`<h2>TeachMe</h2><p class="mu">Watch tutorials, or share your screen and talk to your tutor.</p><div class="tabs"><button id="t1" class="on" onclick="tab(1)">▶ Video tutorials</button><button id="t2" onclick="tab(2)">🎙 Live tutor</button></div><div id="tb"></div>`;tab(1,c?c.name+' tutorial':'')}
function tab(n,q){$('#t1').className=n==1?'on':'';$('#t2').className=n==2?'on':'';if(n==1){$('#tb').innerHTML=`<div class="bar"><input id="yq" value="${esc(q||'')}" placeholder="Type a topic or a question" onkeydown="event.key==='Enter'&&yt()"><button onclick="yt()">Search videos</button></div><div id="pl"></div><div id="yr" class="grid"></div>`;q&&yt()}else $('#tb').innerHTML=`<div class="live"><div class="scr"><video id="sv" autoplay muted playsinline></video><div class="bar"><button onclick="share()">🖥 Share screen</button><button class="ghost" onclick="stopS()">Stop</button><label><input type="checkbox" id="sn" checked> Tutor sees my screen</label><label><input type="checkbox" id="sp"> Speak answers</label></div></div><div class="card"><div id="cm"><div class="bb ai">Hi! Share your screen or just ask me anything about your course.</div></div><div class="bar"><input id="ci" placeholder="Ask your tutor" onkeydown="event.key==='Enter'&&say()"><button class="ghost" onclick="mic()">🎤</button><button onclick="say()">Send</button></div></div></div>`}
async function yt(){const q=$('#yq').value.trim();if(!q)return;$('#yr').innerHTML='<p class="mu">Searching…</p>';const r=await api('yt',{q});$('#yr').innerHTML=(r.items||[]).length?r.items.map(i=>`<div class="card vd" onclick="play('${encodeURIComponent(i.id)}')"><div class="pt">▶</div><b>${esc(i.title)}</b><p class="mu">${esc(i.ch)}</p></div>`).join(''):`<p class="mu">${esc(r.note||'No videos found.')} <a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}">Search on YouTube</a></p>`}
function play(id){$('#pl').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>`;scrollTo(0,0)}
let ST,HI=[];
async function share(){try{ST=await navigator.mediaDevices.getDisplayMedia({video:true});$('#sv').srcObject=ST;ST.getVideoTracks()[0].onended=stopS}catch(e){toast('Screen sharing is not available on this device or was cancelled.')}}
function stopS(){ST&&ST.getTracks().forEach(t=>t.stop());ST=null;const v=$('#sv');if(v)v.srcObject=null}
function snap(){const v=$('#sv');if(!ST||!v.videoWidth)return null;const c=document.createElement('canvas'),w=Math.min(1024,v.videoWidth);c.width=w;c.height=w*v.videoHeight/v.videoWidth;c.getContext('2d').drawImage(v,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6).split(',')[1]}
function bub(w,t){const d=document.createElement('div');d.className='bb '+w;d.textContent=t;$('#cm').append(d);d.scrollIntoView()}
async function say(){const i=$('#ci'),t=i.value.trim();if(!t)return;i.value='';bub('me',t);HI.push({role:'user',content:t});const r=await api('ai',{msgs:HI,img:$('#sn').checked?snap():null}),x=r.text||r.error||'Something went wrong.';HI.push({role:'assistant',content:x});bub('ai',x);if($('#sp').checked)speechSynthesis.speak(new SpeechSynthesisUtterance(x))}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voice input is not supported in this browser.');const r=new R();r.onresult=e=>{$('#ci').value=e.results[0][0].transcript;say()};r.start()}
let Q;
function pasco(){const a=S.arg||{};$('#v').innerHTML=`<h2>Pasco</h2><p class="mu">Past questions turned into a game. Earn XP and keep your streak.</p><div class="bar"><select id="pc">${S.courses.map(c=>`<option value="${c.id}" ${c.id===a.cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select><button onclick="startQ()">▶ Play</button><label class="btn alt">⬆ Upload past questions<input type="file" id="pf" accept=".pdf,.txt" hidden onchange="upQ(this)"></label></div><div class="bar"><input id="gt" placeholder="Or type a topic and let AI write questions"><button class="ghost" onclick="genQ()">✨ Generate</button></div><p class="mu">Upload format: “1. Question? A. … B. … C. … D. … Answer: B”.</p><div id="qa"></div>`}
function parseQ(t){const qs=[];t.replace(/\r/g,'').split(/\n(?=\s*\d{1,3}[.)]\s)/).forEach(b=>{const m=b.match(/^\s*\d{1,3}[.)]\s*([\s\S]*?)(?=\s\(?A[.)]\s)/),o=[...b.matchAll(/(?:^|\s)\(?([A-E])[.)]\s+([\s\S]*?)(?=\s\(?[A-E][.)]\s|\s*(?:Ans(?:wer)?|Correct)\s*[:\-]|$)/g)],a=b.match(/(?:Ans(?:wer)?|Correct)\s*[:\-]?\s*\(?([A-E])/i),f=s=>s.trim().replace(/\s+/g,' ');if(m&&o.length>1&&a)qs.push({q:f(m[1]),o:o.map(x=>f(x[2])),a:'ABCDE'.indexOf(a[1].toUpperCase())})});return qs}
async function upQ(el){const f=el.files[0];if(!f)return;let t='';try{if(/pdf$/i.test(f.name)){const d=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;for(let i=1;i<=d.numPages;i++){let y=null;(await(await d.getPage(i)).getTextContent()).items.forEach(it=>{const Y=it.transform[5];t+=(y!==null&&Math.abs(Y-y)>2?'\n':' ')+it.str;y=Y});t+='\n'}}else t=await f.text()}catch(e){return toast('Could not read that file.')}const qs=parseQ(t);if(!qs.length)return toast('No questions found. Check the upload format below.');const r=await api('addq',{cid:$('#pc').value,qs});toast(qs.length+' questions added to this course.')}
async function genQ(){const t=$('#gt').value.trim();if(!t)return toast('Type a topic first.');toast('Writing questions…');const c=S.courses.find(x=>x.id===$('#pc').value),r=await api('genq',{course:c.name,topic:t});if(r.error)return toast(r.error);await api('addq',{cid:c.id,qs:r.qs});toast(r.qs.length+' questions added.')}
async function startQ(){const r=await api('getq',{cid:$('#pc').value}),l=(r.qs||[]).sort(()=>Math.random()-.5).slice(0,10);if(!l.length)return $('#qa').innerHTML='<p class="mu">No questions for this course yet. Upload past questions above.</p>';Q={l,i:0,ok:0,st:0,xp:0,d:0};showQ()}
function showQ(){const q=Q.l[Q.i];if(!q)return endQ();$('#qa').innerHTML=`<div class="card"><div class="prog"><i style="width:${Q.i/Q.l.length*100}%"></i></div><p class="mu">Question ${Q.i+1} of ${Q.l.length}. Streak 🔥 ${Q.st}. XP ${Q.xp}</p><div class="q">${esc(q.q)}</div>${q.o.map((o,i)=>`<button class="opt" onclick="pick(${i})">${'ABCDE'[i]}. ${esc(o)}</button>`).join('')}</div>`}
function pick(i){if(Q.d)return;Q.d=1;const q=Q.l[Q.i],b=document.querySelectorAll('.opt');b[q.a].classList.add('ok');if(i===q.a){Q.ok++;Q.st++;Q.xp+=10+Math.min(Q.st,5)*2}else{b[i].classList.add('no');Q.st=0}setTimeout(()=>{Q.d=0;Q.i++;showQ()},1100)}
async function endQ(){const r=await api('saveme',{xp:(S.user.xp||0)+Q.xp});if(r.user)S.user=r.user;$('#qa').innerHTML=`<div class="card"><h2>${Q.ok>=Q.l.length*.7?'Great work! 🎉':'Keep going 💪'}</h2><p>You got ${Q.ok} of ${Q.l.length} and earned ${Q.xp} XP. Total XP: ${S.user.xp}.</p><button onclick="startQ()">Play again</button></div>`}
function acct(){const u=S.user;$('#v').innerHTML=`<h2>Account</h2><div class="card" style="max-width:520px;display:grid;gap:10px"><div class="bar">${u.pic?`<img class="av" src="${u.pic}" alt="">`:`<div class="av">${esc(u.name[0])}</div>`}<label class="btn alt">Change photo<input type="file" accept="image/*" hidden onchange="pic(this)"></label><b>⭐ ${u.xp||0} XP</b></div><input id="fn" value="${esc(u.name)}" placeholder="Full name"><input id="fs" value="${esc(u.school)}" placeholder="School"><select id="fl">${lvOpts(u.level)}</select><input value="${esc(u.email)}" disabled><button onclick="saveA()">Save changes</button></div>`}
function pic(el){const f=el.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);S.user.pic=c.toDataURL('image/jpeg',.8);acct();toast('Photo ready. Press Save changes.')};im.src=URL.createObjectURL(f)}
async function saveA(){const r=await api('saveme',{name:$('#fn').value,school:$('#fs').value,level:$('#fl').value,pic:S.user.pic});if(r.error)return toast(r.error);S.user=r.user;toast('Changes saved.')}
async function admin(){const n=(await api('users')).n||0;$('#v').innerHTML=`<h2>Admin portal</h2><div class="grid" style="margin:12px 0"><div class="card"><h2>${n}</h2><span class="mu">Students</span></div><div class="card"><h2>${S.courses.length}</h2><span class="mu">Courses</span></div></div><h3>Add a course</h3><div class="bar"><input id="cn" placeholder="Course name"><input id="cc" placeholder="Code"><input id="cs" placeholder="School" value="UEW"><select id="cl"><option>All levels</option>${lvOpts()}</select><button onclick="addC()">Add course</button></div><h3>Courses and materials</h3>${S.courses.map(c=>`<div class="card" style="margin-bottom:10px"><div class="li"><b>${esc(c.name)} <span class="mu">${esc(c.code)}</span></b><button class="danger" onclick="delC('${c.id}')">Delete course</button></div>${c.materials.map(m=>`<div class="li"><span>📄 ${esc(m.title)}</span><button class="ghost" onclick="delM('${c.id}','${m.id}')">Remove</button></div>`).join('')}<div class="bar"><input id="mt${c.id}" placeholder="Material title"><label class="btn alt">⬆ Upload PDF<input type="file" accept="application/pdf" hidden onchange="upM('${c.id}',this)"></label></div></div>`).join('')}<p class="mu">Word or PowerPoint files: save them as PDF first.</p>`}
const sync=r=>{if(r.error)return toast(r.error);S.courses=r.courses;admin()};
async function addC(){const n=$('#cn').value.trim();if(!n)return toast('Enter a course name.');sync(await api('savecourse',{course:{name:n,code:$('#cc').value.trim(),school:$('#cs').value.trim(),level:$('#cl').value}}))}
async function delC(id){if(confirm('Delete this course and all its files?'))sync(await api('delcourse',{id}))}
async function delM(cid,mid){const c=S.courses.find(x=>x.id===cid);sync(await api('savecourse',{course:{...c,materials:c.materials.filter(m=>m.id!==mid)}}))}
function upM(cid,el){const f=el.files[0];if(!f)return;if(f.size>650000)return toast('File is too big. Keep PDFs under 650 KB.');const r=new FileReader();r.onload=async()=>sync(await api('upload',{cid,title:$('#mt'+cid).value.trim()||f.name.replace(/\.pdf$/i,''),data:r.result}));r.readAsDataURL(f)}
(async()=>{try{S.tok=localStorage.getItem('ap_t')}catch(e){}if(S.tok){const r=await api('me');if(r.user||r.admin){S.user=r.user;S.admin=!!r.admin;return enter()}}authView()})();
</script></body></html>
